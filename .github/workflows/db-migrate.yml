name: DB Migrate

# Applies the SQL migrations to Supabase so the live schema never drifts from the
# repo again. Every migration in supabase/migrations/ is idempotent (guarded with
# IF NOT EXISTS / DROP ... IF EXISTS / CREATE OR REPLACE / ON CONFLICT), so we can
# safely replay the whole folder in filename order on every change — no migration
# tracking table, no 14-digit-timestamp renames required.
#
# One-time setup: add the repo secret SUPABASE_DB_URL = the project's DIRECT
# Postgres connection string (Supabase → Project Settings → Database → Connection
# string → URI, the direct 5432 one, NOT the pooler). Then push or run manually
# once to reconcile the current drifted DB.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch: {}

# Never run two migration jobs at once against the same DB.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations in order
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          shopt -s nullglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo ">>> applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "All migrations applied — schema is in sync."
