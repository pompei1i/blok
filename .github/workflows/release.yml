name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      - name: Generate NSIS assets
        working-directory: desktop
        run: node scripts/gen-nsis-assets.mjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "$blok ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Download artifacts from private release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern "blok_*-setup.exe" --pattern "blok_*-setup.exe.sig" --pattern "latest.json"

      - name: Rewrite latest.json URLs for public repo
        run: |
          $json = [System.IO.File]::ReadAllText("latest.json")
          $json = $json.Replace("/pompei1i/blok/releases/download/", "/pompei1i/blok-releases/releases/download/")
          [System.IO.File]::WriteAllText("latest.json", $json, [System.Text.Encoding]::UTF8)

      - name: Publish to blok-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $exe = (Get-Item "blok_*-setup.exe").Name
          $sig = (Get-Item "blok_*-setup.exe.sig").Name
          gh release create "${{ github.ref_name }}" `
            --repo pompei1i/blok-releases `
            --title "`$blok ${{ github.ref_name }}" `
            --notes "See the assets below to download the installer."
          gh release upload "${{ github.ref_name }}" `
            --repo pompei1i/blok-releases `
            "$exe" "$sig" "latest.json"
