name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ── Main app ──────────────────────────────────────────────────────────────

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (desktop)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      - name: Generate NSIS assets
        working-directory: desktop
        run: node scripts/gen-nsis-assets.mjs

      - name: Inject build secrets into .env
        shell: bash
        working-directory: desktop
        run: |
          printf '\nVITE_BAIT_DEFAULT_KEY=%s' "${{ secrets.VITE_BAIT_DEFAULT_KEY }}" >> .env

      - name: Verify VITE_BAIT_DEFAULT_KEY is set
        shell: bash
        working-directory: desktop
        run: |
          value=$(grep '^VITE_BAIT_DEFAULT_KEY=' .env | cut -d= -f2-)
          if [ -z "$value" ]; then
            echo "ERROR: VITE_BAIT_DEFAULT_KEY is empty — check GitHub secret"
            exit 1
          fi
          echo "VITE_BAIT_DEFAULT_KEY is set (${#value} chars)"

      - name: Delete existing private release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes 2>&1 | Out-Null; $LASTEXITCODE = 0

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TENOR_API_KEY: ${{ secrets.VITE_TENOR_API_KEY }}
          VITE_BAIT_DEFAULT_KEY: ${{ secrets.VITE_BAIT_DEFAULT_KEY }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "$blok ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Download unsigned installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          gh release download "${{ github.ref_name }}" --pattern "blok_*-setup.exe" --dir unsigned --clobber

      - name: Upload unsigned installer for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: blok-unsigned
          path: unsigned/

      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: blok
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Re-create Tauri updater signature for signed binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exeName = (Get-Item "unsigned/blok_*-setup.exe").Name
          Copy-Item "signed/$exeName" . -Force
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri.key"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY, $utf8NoBom)
          Set-Location desktop
          npx tauri signer sign -f $keyPath -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "../$exeName"
          Set-Location ..
          Remove-Item -Force $keyPath
          Write-Host "Signed: $exeName + $exeName.sig"

      - name: Download latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --pattern "latest.json" --clobber

      - name: Rewrite latest.json URLs for public repo
        run: |
          $json = [System.IO.File]::ReadAllText("latest.json")
          $json = $json.Replace("/pompei1i/blok/releases/download/", "/pompei1i/blok-releases/releases/download/")
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("latest.json", $json, $utf8NoBom)

      - name: Verify latest.json has no BOM
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("latest.json")
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error "latest.json contains UTF-8 BOM — updater will break on Windows. Aborting."
            exit 1
          }
          Write-Host "latest.json OK — no BOM (first bytes: $($bytes[0]) $($bytes[1]) $($bytes[2]))"

      # ── Stub installer ────────────────────────────────────────────────────────

      - name: Rust cache (installer)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./installer/src-tauri -> target"

      - name: Install installer deps
        working-directory: installer
        run: npm install

      - name: Build stub installer
        working-directory: installer
        run: npx tauri build --no-bundle

      - name: Rename stub installer
        run: Copy-Item "installer\src-tauri\target\release\blok-ui.exe" "blok-installer.exe"

      # ── Publish to public releases repo ──────────────────────────────────────

      - name: Publish to blok-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          $exe = (Get-Item "blok_*-setup.exe").Name
          $sig = (Get-Item "blok_*-setup.exe.sig").Name
          gh release delete "${{ github.ref_name }}" --repo pompei1i/blok-releases --yes 2>&1 | Out-Null
          $LASTEXITCODE = 0
          gh release create "${{ github.ref_name }}" `
            --repo pompei1i/blok-releases `
            --title "`$blok ${{ github.ref_name }}" `
            --notes "See the assets below to download the installer."
          gh release upload "${{ github.ref_name }}" `
            --repo pompei1i/blok-releases `
            "$exe" "$sig" "latest.json" "blok-installer.exe"
