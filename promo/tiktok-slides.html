<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>blok — tiktok slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --surface:#0f0f0f; --red:#c0392b;
    --text:#e0e0e0; --muted:#8a8a8a; --dim:#4a4a4a; --border:#333;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#050505; color:var(--text);
    font-family:'IBM Plex Mono','JetBrains Mono',monospace; }

  /* ── toolbar ── */
  .bar{
    position:sticky; top:0; z-index:50; display:flex; gap:12px; align-items:center;
    flex-wrap:wrap; padding:14px 20px; background:#000; border-bottom:1px solid #1a1a1a;
  }
  .bar b{ color:var(--text); letter-spacing:2px; font-weight:600; margin-right:8px; }
  .bar .meta{ color:var(--dim); font-size:12px; flex:1; }
  .bar button{
    font-family:inherit; font-size:12px; letter-spacing:1px; cursor:pointer;
    background:transparent; color:var(--muted); border:1px solid var(--border);
    padding:8px 14px; transition:.15s;
  }
  .bar button:hover{ border-color:var(--text); color:var(--text); }
  .bar button.go{ color:var(--text); border-color:#4a4a4a; }

  /* ── deck / preview scaling via zoom (does not affect capture) ── */
  .deck{ zoom:.5; display:flex; flex-direction:column; align-items:center;
    gap:48px; padding:48px 0 120px; }
  .frame{ position:relative; }
  .frame .dl{
    position:absolute; top:16px; right:16px; z-index:5; font-family:inherit;
    font-size:22px; letter-spacing:1px; cursor:pointer; background:#000;
    color:var(--muted); border:1px solid var(--border); padding:10px 16px;
  }
  .frame .dl:hover{ border-color:var(--text); color:var(--text); }

  /* ── the slide (captured node, exact 1080x1350) ── */
  .slide{
    width:1080px; height:1350px; background:var(--bg); color:var(--text);
    position:relative; overflow:hidden; padding:120px 96px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .slide::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:48px 48px;
  }
  .slide > *{ position:relative; z-index:1; }

  .corner{ position:absolute; top:60px; left:96px; color:#363636;
    font-size:24px; letter-spacing:.08em; }
  .foot{ position:absolute; left:96px; right:96px; bottom:60px;
    display:flex; justify-content:space-between; align-items:center;
    color:#2f2f2f; font-size:24px; letter-spacing:.12em; }
  .foot .brand{ color:var(--muted); }

  .logo{ color:#fff; font-size:42px; line-height:1.14; margin:0 0 8px;
    white-space:pre; letter-spacing:0; }
  .big{ font-size:60px; font-weight:500; color:#f0f0f0; letter-spacing:.5px;
    line-height:1.22; margin:0; }
  .tag{ font-size:40px; color:var(--red); letter-spacing:.18em; font-weight:500;
    margin-bottom:38px; }
  .line{ font-size:40px; line-height:1.85; color:#d2d2d2; letter-spacing:.3px; }
  .line.muted{ color:var(--muted); }
  .px{ color:var(--muted); margin-right:14px; }
  .px-red{ color:var(--red); margin-right:14px; }
  .dim{ color:#585858; font-size:30px; letter-spacing:.12em; }
  .sp8{ height:8px } .sp24{ height:24px } .sp40{ height:40px } .sp64{ height:64px }
</style>
</head>
<body>
  <div class="bar">
    <b>$ blok</b>
    <span class="meta">tiktok carousel · 1080×1350 · screenshot or use download (PNG @2x)</span>
    <button onclick="setZoom(.35)">25%</button>
    <button onclick="setZoom(.5)">50%</button>
    <button onclick="setZoom(1)">100%</button>
    <button class="go" onclick="downloadAll()">⬇ download all (.zip)</button>
  </div>

  <div class="deck" id="deck"></div>

<script>
const LOGO =
"██████╗ ██╗      ██████╗ ██╗  ██╗\n" +
"██╔══██╗██║     ██╔═══██╗██║ ██╔╝\n" +
"██████╔╝██║     ██║   ██║█████╔╝\n" +
"██╔══██╗██║     ██║   ██║██╔═██╗\n" +
"██████╔╝███████╗╚██████╔╝██║  ██╗\n" +
"╚═════╝ ╚══════╝ ╚═════╝ ╚═╝  ╚═╝";

// line types: logo, big, tag, prompt, gt, err, ok, check, comment, dash, plain, dim, sp
const SLIDES = [
  { label:"~/blok/cover", lines:[
    { t:"prompt", v:"blok" },
    { t:"sp40" },
    { t:"logo" },
    { t:"sp40" },
    { t:"gt", v:"discord without the bloat" },
    { t:"sp24" },
    { t:"dim", v:"swipe →" },
  ]},
  { label:"~/blok/why", lines:[
    { t:"big", v:"tired of discord?" },
    { t:"sp64" },
    { t:"err", v:"eats 2gb of ram" },
    { t:"err", v:"shoves ads at you" },
    { t:"err", v:"tracks everything" },
  ]},
  { label:"~/blok/what", lines:[
    { t:"big", v:"blok" },
    { t:"sp40" },
    { t:"comment", v:"native desktop" },
    { t:"comment", v:"no electron" },
    { t:"comment", v:"no browser tab" },
  ]},
  { label:"~/blok/voice", lines:[
    { t:"tag", v:"[ voice ]" },
    { t:"big", v:"voice engine on rust 🦀" },
    { t:"sp40" },
    { t:"dash", v:"noise suppression" },
    { t:"dash", v:"echo cancellation" },
    { t:"dash", v:"push-to-talk" },
  ]},
  { label:"~/blok/media", lines:[
    { t:"tag", v:"[ screen + video ]" },
    { t:"sp8" },
    { t:"plain", v:"screen share 1–30 fps" },
    { t:"plain", v:"p2p video calls" },
    { t:"plain", v:"native window picker" },
  ]},
  { label:"~/blok/ai", lines:[
    { t:"tag", v:"[ b.ai.t ]" },
    { t:"big", v:"built-in ai" },
    { t:"sp40" },
    { t:"plain", v:"powered by claude" },
    { t:"plain", v:"summarizes any channel" },
    { t:"plain", v:"right inside the chat" },
  ]},
  { label:"~/blok/economy", lines:[
    { t:"tag", v:"[ economy ]" },
    { t:"sp8" },
    { t:"plain", v:"xp · levels" },
    { t:"plain", v:"daily quests" },
    { t:"plain", v:"loot boxes + shop" },
  ]},
  { label:"~/blok/custom", lines:[
    { t:"tag", v:"[ custom ]" },
    { t:"sp8" },
    { t:"plain", v:"your own themes" },
    { t:"plain", v:"custom chat background" },
    { t:"plain", v:"6 languages" },
    { t:"dim", v:"en · ru · ua · pl · de · es" },
  ]},
  { label:"~/blok/roadmap", lines:[
    { t:"big", v:"coming soon:" },
    { t:"sp40" },
    { t:"check", v:"threads" },
    { t:"check", v:"custom emojis" },
    { t:"check", v:"spoilers / code blocks" },
    { t:"check", v:"macos / linux" },
  ]},
  { label:"~/blok/get", lines:[
    { t:"ok", v:"blok" },
    { t:"sp40" },
    { t:"comment", v:"open source" },
    { t:"prompt", v:"download → getblok.app" },
    { t:"gt", v:"follow for updates" },
  ]},
];

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderLine(l){
  switch(l.t){
    case "logo":    return `<pre class="logo">${esc(LOGO)}</pre>`;
    case "big":     return `<div class="big">${esc(l.v)}</div>`;
    case "tag":     return `<div class="tag">${esc(l.v)}</div>`;
    case "prompt":  return `<div class="line"><span class="px">$</span>${esc(l.v)}</div>`;
    case "gt":      return `<div class="line"><span class="px">&gt;</span>${esc(l.v)}</div>`;
    case "err":     return `<div class="line"><span class="px-red">[!]</span>${esc(l.v)}</div>`;
    case "ok":      return `<div class="line"><span class="px-red">[✓]</span>${esc(l.v)}</div>`;
    case "check":   return `<div class="line"><span class="px">[ ]</span>${esc(l.v)}</div>`;
    case "comment": return `<div class="line muted"># ${esc(l.v)}</div>`;
    case "dash":    return `<div class="line"><span class="px">—</span>${esc(l.v)}</div>`;
    case "plain":   return `<div class="line">${esc(l.v)}</div>`;
    case "dim":     return `<div class="dim">${esc(l.v)}</div>`;
    default:        return `<div class="${l.t}"></div>`; // spacers: sp8/sp24/sp40/sp64
  }
}

const deck = document.getElementById("deck");
SLIDES.forEach((s, i) => {
  const idx = String(i+1).padStart(2,"0");
  const frame = document.createElement("div");
  frame.className = "frame";
  frame.innerHTML =
    `<button class="dl" data-html2canvas-ignore="true" data-i="${i}">download</button>` +
    `<div class="slide" id="slide-${i}">` +
      `<div class="corner">┌─ ${esc(s.label)}</div>` +
      s.lines.map(renderLine).join("") +
      `<div class="foot"><span class="brand">$blok</span><span>${idx} / ${String(SLIDES.length).padStart(2,"0")}</span></div>` +
    `</div>`;
  deck.appendChild(frame);
});

function setZoom(z){ deck.style.zoom = z; }

async function capture(i){
  await document.fonts.ready;
  const node = document.getElementById("slide-"+i);
  const canvas = await html2canvas(node, {
    backgroundColor:"#0a0a0a", scale:2,
    width:1080, height:1350, windowWidth:1080, windowHeight:1350,
  });
  return canvas;
}
function saveCanvas(canvas, name){
  const a = document.createElement("a");
  a.download = name; a.href = canvas.toDataURL("image/png"); a.click();
}
async function downloadOne(i){
  const c = await capture(i);
  saveCanvas(c, `blok-${String(i+1).padStart(2,"0")}.png`);
}
// Browsers block multiple sequential downloads — bundle all 10 PNGs into one ZIP.
async function downloadAll(){
  const btn = document.querySelector(".bar button.go");
  const label = btn.textContent;
  const prev = deck.style.zoom; deck.style.zoom = 1;        // capture at full res
  try {
    const zip = new JSZip();
    for (let i=0;i<SLIDES.length;i++){
      btn.textContent = `rendering ${i+1}/${SLIDES.length}…`;
      const canvas = await capture(i);
      const b64 = canvas.toDataURL("image/png").split(",")[1];
      zip.file(`blok-${String(i+1).padStart(2,"0")}.png`, b64, { base64:true });
    }
    btn.textContent = "zipping…";
    const blob = await zip.generateAsync({ type:"blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.download = "blok-slides.zip"; a.href = url; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  } finally {
    deck.style.zoom = prev;
    btn.textContent = label;
  }
}

deck.addEventListener("click", (e)=>{
  const btn = e.target.closest(".dl");
  if (btn) downloadOne(Number(btn.dataset.i));
});
</script>
</body>
</html>
