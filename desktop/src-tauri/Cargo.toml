[package]
name = "blok"
version = "0.9.0"
description = "$blok - terminal-style chat app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Screen-capture encode (image crate's JPEG + resize) is generic, so its hot code
# monomorphizes into THIS crate — a plain dev build leaves it unoptimized and screen
# share crawls (~450ms/frame vs ~50ms optimized). opt-level=2 on our crate fixes that
# while keeping dev compiles reasonable; deps get full opt too.
# incremental=false: opt-level>0 + incremental + Rust's bundled lld linker emits
# unresolved "hidden symbol .llvm.*" link errors on this dependency graph (webrtc).
# Release already sets incremental=false — matching it here fixes the dev link.
[profile.dev]
opt-level = 2
incremental = false
[profile.dev.package."*"]
opt-level = 3
[profile.test]
opt-level = 2
incremental = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
# SIMD JPEG encoder (pure Rust, no system libs) for the screen-capture frame path.
jpeg-encoder = { version = "0.6", features = ["simd"] }
# Software H.264 for screen share, built from source (fallback when there is no
# hardware encoder; see h264.rs). Needs NASM on PATH at build time for its
# assembly, which makes it ~3x faster.
openh264 = "0.9"
openh264-sys2 = "0.9"
base64 = "0.22"
# Native P2P transport (data channels only) — replaces browser RTCPeerConnection,
# which Ubuntu/Mint's system WebKitGTK is compiled without. Pure Rust, same code
# path on Windows and Linux.
webrtc = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
bytes = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
] }
# `#[implement]` (process-loopback activation callback) expands to `::windows_core` paths.
windows-core = "0.61"

# Matches the webkit2gtk version wry/tauri already pulls in on Linux (see Cargo.lock) — must
# stay in lockstep with that transitive version or the two `WebView`/`PermissionRequest`
# types (ours vs wry's) won't be interchangeable.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

