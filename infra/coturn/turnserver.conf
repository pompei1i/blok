# coturn config for blok — self-hosted TURN relay (replaces the 500 MB Metered cap).
# Edit the three CHANGE_ME values, then `docker compose up -d`.
#
# Screen share / camera traverse NAT over WebRTC; when both peers are behind
# strict NAT the media must be relayed. coturn is that relay — no monthly quota,
# only your VPS bandwidth (a €4/mo box handles a small community fine).

# ── Network ───────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# The VPS PUBLIC IP. If the box is behind a NAT/cloud-LB, use external-ip=PUBLIC/PRIVATE.
external-ip=CHANGE_ME_PUBLIC_IP

# Relay media port range — must be open in the firewall (see README).
min-port=49160
max-port=49200

# ── Auth (long-term credentials, baked into the client build) ─────────────────
# The client sends VITE_TURN_USERNAME / VITE_TURN_CREDENTIAL — set them to match.
lt-cred-mech
realm=blok.turn
user=blokturn:CHANGE_ME_STRONG_PASSWORD

# ── Abuse limits (creds are extractable from the client, so cap usage) ────────
# Concurrent relay sessions per user and server-wide; tune for your box.
user-quota=12
total-quota=1200
# Optional bandwidth cap per allocation (bytes/sec). 0 = unlimited.
# max-bps=2000000

# ── Hardening ─────────────────────────────────────────────────────────────────
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
fingerprint
# Block relaying to internal ranges so the relay can't be used to probe your LAN.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# ── TLS (optional but recommended — turns: on 5349 traverses strict firewalls) ─
# Point a subdomain (e.g. turn.yourdomain.com) at the VPS, run certbot, then
# uncomment and mount the certs in docker-compose.yml.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
